<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List Modern</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar style */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .task-enter {
            animation: slideIn 0.25s ease-out forwards;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Container Utama -->
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-600 text-white rounded-2xl shadow-lg mb-3">
                <i class="fa-solid fa-list-check text-2xl sm:text-3xl"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight">Task Manager</h1>
            <p class="text-slate-500 mt-2 text-sm sm:text-base">Kelola tugas harianmu dengan rapi dan efisien</p>
        </header>

        <!-- Card Wrapper -->
        <main class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-5 sm:p-8 border border-slate-100">
            
            <!-- Input Form -->
            <form id="todoForm" class="flex flex-col sm:flex-row gap-3 mb-6">
                <div class="relative flex-1">
                    <input 
                        type="text" 
                        id="todoInput" 
                        placeholder="Tambahkan rencana atau tugas baru..." 
                        class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white text-slate-800 placeholder-slate-400 transition-all text-sm sm:text-base"
                        required
                        autocomplete="off"
                    >
                    <i class="fa-regular fa-pen-to-square absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
                <button 
                    type="submit" 
                    class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium px-6 py-3.5 rounded-2xl shadow-md shadow-indigo-200 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer text-sm sm:text-base"
                >
                    <i class="fa-solid fa-plus text-base"></i>
                    <span>Tambah</span>
                </button>
            </form>

            <!-- Filter Buttons & Stats -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pb-4 mb-4 border-b border-slate-100">
                <!-- Filter Status -->
                <div class="flex items-center bg-slate-100 p-1 rounded-xl w-full sm:w-auto text-xs sm:text-sm font-medium">
                    <button id="filterAll" onclick="setFilter('all')" class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-slate-600 transition-all active-filter">
                        Semua
                    </button>
                    <button id="filterActive" onclick="setFilter('active')" class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-slate-600 transition-all">
                        Aktif
                    </button>
                    <button id="filterCompleted" onclick="setFilter('completed')" class="filter-btn flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-slate-600 transition-all">
                        Selesai
                    </button>
                </div>

                <!-- Info Jumlah Tugas -->
                <div class="text-xs sm:text-sm text-slate-500 font-medium self-end sm:self-center">
                    <span id="pendingCount" class="font-semibold text-indigo-600">0</span> tugas tersisa
                </div>
            </div>

            <!-- List Tugas -->
            <ul id="todoList" class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                <!-- Data akan di-render menggunakan JavaScript -->
            </ul>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-regular fa-clipboard text-2xl"></i>
                </div>
                <p class="text-slate-600 font-medium">Belum ada tugas di daftar ini</p>
                <p class="text-slate-400 text-xs sm:text-sm mt-1">Tulis tugas pertama kamu pada kolom di atas!</p>
            </div>

            <!-- Footer Card / Hapus Semua Selesai -->
            <div id="cardFooter" class="mt-6 pt-4 border-t border-slate-100 flex justify-between items-center text-xs sm:text-sm text-slate-500">
                <span id="completionProgress">0% selesai</span>
                <button 
                    onclick="clearCompleted()" 
                    class="text-rose-500 hover:text-rose-700 font-medium hover:underline transition-all cursor-pointer"
                >
                    Hapus yang Selesai
                </button>
            </div>

        </main>
    </div>

    <!-- Footer Aplikasi -->
    <footer class="py-4 text-center text-xs text-slate-400">
        <p>Aplikasi To-Do List &copy; 2026 • Dibuat dengan HTML, CSS & Vanilla JS</p>
    </footer>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">Notifikasi</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Store State
        let todos = JSON.parse(localStorage.getItem('todos_app_data')) || [];
        let currentFilter = 'all';

        // DOM Elements
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const pendingCount = document.getElementById('pendingCount');
        const completionProgress = document.getElementById('completionProgress');
        const cardFooter = document.getElementById('cardFooter');

        // Init App
        document.addEventListener('DOMContentLoaded', () => {
            renderTodos();
        });

        // Event Listener Form Submit
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const taskText = todoInput.value.trim();
            if (taskText !== '') {
                addTodo(taskText);
                todoInput.value = '';
            }
        });

        // Tambah Tugas Baru
        function addTodo(text) {
            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })
            };

            todos.unshift(newTodo);
            saveAndRender();
            showToast('Tugas baru berhasil ditambahkan!', 'success');
        }

        // Toggle Status Selesai / Belum
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            saveAndRender();
        }

        // Hapus Tugas
        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveAndRender();
            showToast('Tugas telah dihapus', 'danger');
        }

        // Filter Function
        function setFilter(filter) {
            currentFilter = filter;
            
            // Update Tampilan Tombol Filter
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm', 'font-semibold');
                btn.classList.add('text-slate-600');
            });

            const activeBtn = document.getElementById(`filter${filter.charAt(0).toUpperCase() + filter.slice(1)}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'text-indigo-600', 'shadow-sm', 'font-semibold');
                activeBtn.classList.remove('text-slate-600');
            }

            renderTodos();
        }

        // Hapus Semua Tugas yang Selesai
        function clearCompleted() {
            const completedCount = todos.filter(t => t.completed).length;
            if (completedCount === 0) {
                showToast('Tidak ada tugas selesai untuk dihapus', 'info');
                return;
            }

            todos = todos.filter(todo => !todo.completed);
            saveAndRender();
            showToast(`${completedCount} tugas selesai berhasil dibersihkan`, 'success');
        }

        // Simpan Data & Render Ulang
        function saveAndRender() {
            localStorage.setItem('todos_app_data', JSON.stringify(todos));
            renderTodos();
        }

        // Render List To-Do ke HTML
        function renderTodos() {
            todoList.innerHTML = '';

            // Filter data berdasarkan opsi aktif
            let filteredTodos = todos;
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }

            // Tampilkan state kosong jika tidak ada data
            if (filteredTodos.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            // Render Item
            filteredTodos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `task-enter flex items-center justify-between p-3.5 sm:p-4 rounded-2xl border transition-all duration-200 group ${
                    todo.completed 
                        ? 'bg-slate-50 border-slate-200/80 text-slate-400' 
                        : 'bg-white border-slate-200 hover:border-indigo-200 hover:shadow-md hover:shadow-slate-100 text-slate-800'
                }`;

                li.innerHTML = `
                    <div class="flex items-center gap-3.5 flex-1 min-w-0 pr-2">
                        <button 
                            onclick="toggleTodo(${todo.id})" 
                            class="w-6 h-6 rounded-lg flex items-center justify-center border transition-all cursor-pointer shrink-0 ${
                                todo.completed 
                                    ? 'bg-indigo-600 border-indigo-600 text-white' 
                                    : 'border-slate-300 hover:border-indigo-500 text-transparent'
                            }"
                        >
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>
                        <span class="text-sm sm:text-base font-medium truncate cursor-pointer select-none ${todo.completed ? 'line-through text-slate-400' : ''}" onclick="toggleTodo(${todo.id})">
                            ${escapeHTML(todo.text)}
                        </span>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-[11px] text-slate-400 font-normal hidden sm:inline-block bg-slate-100 px-2 py-0.5 rounded-md">${todo.createdAt}</span>
                        <button 
                            onclick="deleteTodo(${todo.id})" 
                            class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all cursor-pointer opacity-80 sm:opacity-0 group-hover:opacity-100"
                            title="Hapus Tugas"
                        >
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;

                todoList.appendChild(li);
            });

            // Update statistik
            updateStats();
        }

        // Update Statistik Jumlah & Progress
        function updateStats() {
            const activeTodos = todos.filter(t => !t.completed).length;
            const completedTodos = todos.filter(t => t.completed).length;
            const totalTodos = todos.length;

            pendingCount.textContent = activeTodos;

            const percentage = totalTodos === 0 ? 0 : Math.round((completedTodos / totalTodos) * 100);
            completionProgress.textContent = `${percentage}% tugas selesai`;

            if (totalTodos === 0) {
                cardFooter.classList.add('hidden');
            } else {
                cardFooter.classList.remove('hidden');
            }
        }

        // Utility: Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;

            if (type === 'danger') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-amber-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Utility: Prevent XSS Input
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Default Filter Active Style Init
        setFilter('all');
    </script>
</body>
</html>
